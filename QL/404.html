<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Qantom Lab</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00D9FF; --blue:#5B5BFF; --purple:#A855F7;
  --navy:#050816; --black:#030303;
  --glass:rgba(255,255,255,0.04); --glass-border:rgba(255,255,255,0.09);
  --text:#eef1f8; --muted:#9aa3b8;
  --grad:linear-gradient(120deg, var(--cyan), var(--blue) 55%, var(--purple));
  --ease:cubic-bezier(.16,.84,.44,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(ellipse 90% 60% at 50% -10%, #0d1230 0%, var(--navy) 45%, var(--black) 100%);
  color:var(--text);font-family:'Inter',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;
}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.4;pointer-events:none;}
.orb1{width:480px;height:480px;background:var(--cyan);top:-140px;left:-100px;animation:float1 20s ease-in-out infinite;}
.orb2{width:520px;height:520px;background:var(--purple);bottom:-160px;right:-140px;animation:float2 24s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,50px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-60px,-40px);}}
.card{
  position:relative;z-index:2;text-align:center;max-width:520px;width:100%;margin:24px;
  background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(18px);
  border-radius:28px;padding:64px 40px;
}
.code{
  font-family:'Space Grotesk',sans-serif;font-size:clamp(64px,14vw,120px);font-weight:700;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;letter-spacing:-2px;
}
.ring{width:90px;height:90px;border-radius:50%;border:1px dashed rgba(0,217,255,.3);margin:18px auto 26px;
  animation:spin 18s linear infinite;position:relative;}
.ring::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(168,85,247,.35);}
@keyframes spin{to{transform:rotate(360deg);}}
h1{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;margin-bottom:12px;}
p{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:32px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:100px;
  background:var(--grad);color:#04040a;font-weight:600;font-size:14.5px;text-decoration:none;
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(0,217,255,.4);}
.btn svg{width:16px;height:16px;stroke:#04040a;fill:none;stroke-width:2;}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="card">
  <div class="code">404</div>
  <div class="ring"></div>
  <h1>This page drifted out of orbit.</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back to Qantom Lab.</p>
  <a href="index.html" class="btn">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Home
  </a>
</div>
</body>
</html>
